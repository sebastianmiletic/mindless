[package]
name = "mindless"
version = "0.1.0"
description = "An irreversible focus lock for macOS"
authors = ["Mindless"]
edition = "2021"

[lib]
name = "mindless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
base64 = "0.22"
rfd = "0.15"
